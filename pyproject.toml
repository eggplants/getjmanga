[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling", "uv-dynamic-versioning" ]

[project]
name = "getjmanga"
description = "Retrieve and save images from japanese web comic sites"
readme = "README.md"
keywords = [
  "cli",
  "comici",
  "downloader",
  "gigaviewer",
  "japanese",
  "manga",
  "manga-downloader",
  "piccoma",
  "scraping",
]
license = { text = "MIT" }
authors = [ { name = "eggplants", email = "w10776e8w@yahoo.co.jp" } ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
  "beautifulsoup4>=4.12",
  "cryptography>=43",
  "httpx>=0.28",
  "pathvalidate>=3.2",
  "pillow>=10.4",
  "rich>=13.7",
  "tomlkit>=0.13",
  "ua-generator>=2",
]
urls.Documentation = "https://eggplants.github.io/getjmanga/"
urls.Issues = "https://github.com/eggplants/getjmanga/issues"
urls.Repository = "https://github.com/eggplants/getjmanga"
scripts.getjmanga = "getjmanga.cli:main"
scripts.jm = "getjmanga.cli:main"

[dependency-groups]
dev = [
  "pymarkdownlnt>=0.9.33",
  "pyproject-fmt>=2.11.1",
  "pytest>=9.0.2",
  "pytest-cov>=7",
]
docs = [
  "pdoc>=16",
]

[tool.hatch]
version.source = "uv-dynamic-versioning"
build.targets.wheel.packages = [ "getjmanga" ]
build.targets.sdist.packages = [ "getjmanga" ]

[tool.uv]
python-downloads = "never"
default-groups = [
  "dev",
  "docs",
]
exclude-newer = "P7D"
preview = true

[tool.ruff]
line-length = 120
format.indent-style = "space"
format.quote-style = "double"
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812",
  "CPY001", # Missing copyright notice (this project does not use file headers)
  "D",
]
lint.per-file-ignores."getjmanga/cli.py" = [
  "T201", # `print` found
]
lint.per-file-ignores."getjmanga/config.py" = [
  "FBT001", # Boolean positional argument (`set_option` takes the value `overwrite = true` is set to)
]
lint.per-file-ignores."getjmanga/downloader.py" = [
  "PLR0913", # Too many arguments (one keyword per command line flag)
]
lint.per-file-ignores."getjmanga/session.py" = [
  "ANN401",  # `Any` in `**kwargs` (the override hands httpx's own keyword arguments on untouched)
  "PLC2701", # Private import (httpx keeps its parameter type aliases in `httpx._types`)
]
lint.per-file-ignores."getjmanga/viewers/*.py" = [
  "SLF001", # Private member access (a viewer sends its requests through the extractor's `_get` and `_fetch_image`)
]
lint.per-file-ignores."getjmanga/viewers/publus.py" = [
  "C901",    # Complex functions (straight ports of the PUBLUS viewer's routines)
  "PLR0912", # Too many branches (same)
  "PLR0913", # Too many arguments (same)
  "PLR0915", # Too many statements (same)
  "PLR2004", # Magic values (the viewer's own bounds)
]
lint.per-file-ignores."getjmanga/viewers/speedbinb.py" = [
  "PLR0913", # Too many arguments (the API call takes what the viewer sends, plus whose session to send it on)
]
lint.per-file-ignores."packaging/entrypoint.py" = [
  "INP001", # Implicit namespace package (frozen entry point, not importable content)
]
lint.per-file-ignores."tests/**" = [
  "ANN",     # Missing type annotations (tests/fixtures)
  "ARG",     # Unused arguments (pytest fixtures, lambda stubs)
  "EM",      # Exception message literals (fakes raise inline)
  "FBT003",  # Boolean positional value in a call (the value a config key is set to)
  "INP001",  # Implicit namespace package (no __init__ in tests)
  "PLR0913", # Too many arguments (a fake response takes one per field)
  "PLR2004", # Magic value used in comparison
  "RUF001",  # Ambiguous unicode (titles the sites really use)
  "S101",    # Use of assert detected
  "S105",    # Hardcoded password (canned credentials)
  "TRY003",  # Long exception messages (fakes raise inline)
]
lint.allowed-confusables = [ "／", "｜" ]  # Fullwidth forms the sites put in titles
lint.pydocstyle.convention = "google"

[tool.pytest]
ini_options.markers = [
  "geoblocked: the site refuses GitHub's runners; skipped when GITHUB_ACTIONS is set",
  "network: hits the real site; deselect with -m 'not network'",
]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "semver"
fallback-version = "0.0.0"
